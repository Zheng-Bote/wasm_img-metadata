version: 1
profile: standard
language: de

base_ref: ""

artifacts:
  constitution: "constitution.md"
  adr: "docs/adr"
  prd: "docs/prd"
  design: "docs/design"
  plans: "docs/plans"
  archive: "docs/archive"
  docs:
    - "docs/notes"
  architecture: "docs/arc42.md"

tests:
  include:
    - "tests/**/*.rs"
    - "src/**/*.rs"

thresholds:
  layers:
    - "src/container/**"
    - "src/exif/**"
    - "src/iptc/**"
    - "src/xmp/**"
    - "src/cli/**"
    - "src/provider/**"
  feature_artifacts_required_when:
    min_layers_touched: 2
    touched_paths:
      - "src/**"
      - "Cargo.toml"
      - "spin/**"
      - "wit/**"

exclude:
  - target/**
  - vendor/**
  - node_modules/**
  - .git/**
