[package]
name = "wasm_img-metadata"
version = "0.1.0"
edition = "2021"
description = "Pure Rust EXIF, IPTC, and XMP image metadata extractor for JPEG, TIFF, PNG, and WebP"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
flate2 = "1.1"
